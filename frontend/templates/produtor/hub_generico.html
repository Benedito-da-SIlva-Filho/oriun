     DESCRICAO:
         Template UNICO e generico para todas as telas de "Hub"
         da plataforma Produtor (ver backend/routers/hubs.py para
         a decisao de arquitetura completa). Renderiza o titulo do
         Hub + uma grade de cards (imagem estilo 3D/cartoon, com o
         nome do modulo ja embutido na propria arte). Card com
         url preenchida e clicavel (<a>); card com url=None
         aparece so como visual, sem link (modulo ainda nao
         construido - decisao de Benedito: "so eu uso o Orion
         hoje, sei que nao esta pronto e nao vou clicar").

         Cabecalho com dois botoes de navegacao: "Voltar" (um
         passo atras - usa o historico do navegador, nao um
         caminho fixo, para funcionar independente de qual tela
         levou ate o Hub) e "Home" (direto para /produtor/home,
         sempre).

         v1.0.0: Criacao do modulo (Sessao 034 continuacao 9,
             18/08/2026). Primeiro uso: Hub de Entrada.
         v1.1.0: Sessao 037/038 (21/08/2026, 20:35 -03) - A
             pedido de Benedito, botoes "Voltar"/"Home" movidos da
             area de conteudo branca (.cabecalho-hub) para a
             barra vermelha do topo (.topo-direita) - mesmo padrao
             ja aplicado hoje em varias outras telas
             (gta_compra_cadastro.html v2.13.0, gta_consulta_
             lista.html v1.5.0). Motivo: consistencia visual - o
             usuario ja espera encontrar esses botoes na barra
             vermelha em qualquer tela do sistema. .cabecalho-hub
             simplificado para so o titulo (os botoes de navegacao
             nao duplicam mais em dois lugares).
         v1.2.0: Sessao 041 (28/08/2026, 15:50 -03) - Adicionado
             suporte ao parametro tamanho_card (vindo de
             hubs.py v1.3.0), com duas variacoes de grade:
             '.cards-hub' (padrao, 220-260px - inalterado) e
             '.cards-hub.compacto' (160-190px, gap menor - "Compacto
             medio", primeira tentativa combinada com Benedito para
             Hubs com muitos cards, ex.: Hub de Brincos com 7
             cards). A classe extra 'compacto' e aplicada via
             Jinja2 conforme a variavel tamanho_card recebida do
             backend. Se o resultado nao for suficiente, proximos
             passos combinados: testar faixa ainda menor
             (130-150px) ou revisar abordagem.
         v1.3.0: Sessao 076 (21/09/2026, 16:40 -03) - TOPO e RODAPE
             substituidos por comandos de INCLUDE das pecas-mestras
             produtor_topo.html / produtor_rodape.html. O comando
             de Voltar nao precisou de configuracao extra - o
             padrao ja usado aqui (voltar uma pagina no historico
             do navegador) e exatamente o mesmo comportamento
             padrao ja embutido na peca-mestra por default. Home
             continua aparecendo normalmente. Sem mudanca de
             comportamento - este e o template usado por TODOS os
             Hubs do sistema (Entrada, Brincagem, Brincos, etc.),
             entao a mudanca beneficia todos eles de uma vez so.
     ========================================================= -->
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Language" content="pt-BR">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion SISBOV &#8212; {{ titulo_hub }}</title>
    <link rel="icon" type="image/x-icon" href="/static/img/Consiste_icon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f0f4f8; display: flex; flex-direction: column; height: 100vh; }

        /* ---- Topo ---- */
        .topo { color: #ffffff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .topo-esquerda { display: flex; align-items: center; gap: 14px; }
        .topo h1 { font-size: 18px; font-weight: bold; }
        .topo-direita { display: flex; align-items: center; gap: 14px; font-size: 13px; }
        .badge-perfil { background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 20px; font-size: 11px; }
        .btn-menu { background: none; border: none; color: white; cursor: pointer; font-size: 22px; line-height: 1; }
        .btn-sair { color: white; text-decoration: none; font-size: 13px; }
        .btn-sair:hover { text-decoration: underline; }
        .btn-voltar-topo { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5); padding: 5px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; text-decoration: none; }
        .btn-voltar-topo:hover { background: rgba(255,255,255,0.35); }

        /* ---- Layout ---- */
        .layout { display: flex; flex: 1; overflow: hidden; }

        /* ---- Sidebar ---- */
        .sidebar { background: #ffffff; border-right: 1px solid #e0e0e0; width: 220px; transition: width 0.2s; overflow: hidden; flex-shrink: 0; }
        .sidebar.recolhido { width: 52px; }
        .sidebar.recolhido .menu-texto { display: none; }
        .sidebar.recolhido .menu-secao { display: none; }
        .menu-item { padding: 8px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-left: 3px solid transparent; text-decoration: none; color: #333333; font-size: 14px; white-space: nowrap; }
        .menu-item:hover { background-color: #f5f5f5; }
        .menu-item.ativo { background-color: #FBE9E4; border-left-color: #D4370A; color: #D4370A; font-weight: bold; }
        .menu-icone { font-size: 18px; color: #666666; flex-shrink: 0; }
        .menu-item.ativo .menu-icone { color: #D4370A; }
        .menu-secao { font-size: 11px; color: #999999; padding: 8px 16px 4px; border-top: 1px solid #f0f0f0; margin-top: 4px; }

        /* ---- Conteudo ---- */
        .conteudo { flex: 1; padding: 24px; overflow-y: auto; }

        /* ---- Cabecalho do Hub (so o titulo - v1.1.0: botoes de
             navegacao movidos para a barra vermelha do topo) ---- */
        .cabecalho-hub { margin-bottom: 24px; }
        .titulo-hub { font-size: 20px; font-weight: bold; color: #333333; }

        /* ---- Grade de cards do Hub ----
             Padrao (sem tamanho_card ou tamanho_card='padrao'):
             220-260px por card - usado em Hubs com poucos cards
             (ex.: Entrada, 3 cards).
             Compacto (tamanho_card='compacto'): 160-190px por
             card, gap reduzido - "Compacto medio" (v1.2.0,
             28/08/2026), usado em Hubs com muitos cards (ex.:
             Brincos, 7 cards) para reduzir scroll vertical. */
        .cards-hub { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 260px)); gap: 20px; }
        .cards-hub.compacto { grid-template-columns: repeat(auto-fit, minmax(160px, 190px)); gap: 14px; }
        .card-hub { border-radius: 16px; overflow: hidden; display: block; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s; }
        .card-hub img { width: 100%; display: block; }
        a.card-hub:hover { transform: scale(1.03); box-shadow: 0 6px 16px rgba(0,0,0,0.18); }
        div.card-hub { cursor: default; }

        /* ---- Rodape ---- */
        .rodape { text-align: center; padding: 10px; color: #999999; font-size: 11px; background: #ffffff; border-top: 1px solid #e0e0e0; flex-shrink: 0; }
    </style>
</head>
<body>

    {% include 'produtor/produtor_topo.html' with context %}

    <div class="layout">

        <!-- MENU LATERAL -->
        {% include 'produtor/produtor_menu.html' %}

        <!-- CONTEUDO -->
        <div class="conteudo">

            <div class="cabecalho-hub">
                <div class="titulo-hub">{{ titulo_hub }}</div>
            </div>

            <div class="cards-hub{% if tamanho_card == 'compacto' %} compacto{% endif %}">
                {% for card in cards %}
                    {% if card.url %}
                    <a href="{{ card.url }}" class="card-hub">
                        <img src="/static/{{ card.imagem }}" alt="{{ card.titulo }}">
                    </a>
                    {% else %}
                    <div class="card-hub">
                        <img src="/static/{{ card.imagem }}" alt="{{ card.titulo }}">
                    </div>
                    {% endif %}
                {% endfor %}
            </div>

        </div>
    </div>

    {% include 'produtor/produtor_rodape.html' %}

    <script>
        function toggleMenu() {
            var sidebar = document.getElementById('sidebar');
            if (sidebar) {
                sidebar.classList.toggle('recolhido');
            }
        }
    </script>

</body>
</html>
